<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>esp32-display-qemu-demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .status-card {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }
        .status-label {
            font-weight: 600;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }
        .status-value {
            color: #667eea;
            font-size: 18px;
            font-weight: bold;
        }
        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
            transition: background 0.3s;
        }
        .button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 ESP32 Display QEMU Demo</h1>
        <p class="subtitle">LVGL UI Running on QEMU Emulator</p>
        
        <div class="status-card">
            <span class="status-label">Status</span>
            <span class="status-value" id="status">Loading...</span>
        </div>
        
        <div class="status-card">
            <span class="status-label">Uptime</span>
            <span class="status-value" id="uptime">0s</span>
        </div>
        
        <button class="button" onclick="location.reload()">Refresh</button>
    </div>

    <script>
        async function updateStatus() {
            try {
                const response = await fetch('/api/status', { method: 'GET', cache: 'no-store' });
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('status').textContent = data.status || 'OK';
                    document.getElementById('uptime').textContent = (data.uptime || 0) + 's';
                }
            } catch (e) {
                console.warn('Status update failed:', e);
            }
        }
        
        updateStatus();
        setInterval(updateStatus, 2000);
    </script>
</body>
</html>
